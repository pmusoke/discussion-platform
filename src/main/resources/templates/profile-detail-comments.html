<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}"
>

<body>
    <div class="sub-body" layout:fragment="content">

        <div class="main-content">

            <div th:if="${message}">
                <h1 th:text="${message}"></h1>
            </div>

            <div class="profile-content">

                <div class="profile-page-user-detail">
                    <img class="profile-detail-user-photo" th:src="${vUser.photoUrl}">
                    <span th:text="${vUser.username}"></span>
                    <div th:if="${user != null and vUser.id == user.id}">
                        <a class="profile-detail-edit-profile-link" th:href="@{/profile/{userId}/edit(userId=${user.id})}">Edit Profile</a>
                    </div>
                </div>

                <div class="profile-tabs">
                    <a th:href="@{/profile/{vUserId}/posts(vUserId=${vUser.id})}">Posts</a>
                    <a th:href="@{/profile/{vUserId}/comments(vUserId=${vUser.id})}">Comments</a>
                </div>
            </div>



            <div class="post-list-index" th:each="comment : ${comments}">
                
                    <div class="first-row-post-index">
                        <a class="community-picture-index-link" th:href="@{/community/{communityName}(communityName=${comment.post.community.name})}"><img class="community-profile-picture-index" th:src="${comment.post.community.communityPictureUrl}"></a>
                        <a class="community-name-index-link" th:href="@{/community/{communityName}(communityName=${comment.post.community.name})}"><span class="community-name-index" th:text="${comment.post.community.name}"></span></a>
                        <a class="created-on-link-index" th:href="@{/posts/{postId}(postId=${comment.post.id})}"><span class="created-on-index" th:text="${#temporals.format(comment.createdOn, 'dd-MM-yyyy, HH:mm')}"></span></a>         
                    </div>       
                    <a class="comment-comment" th:href="@{/posts/{postId}(postId=${comment.post.id})}"><span th:text="${comment.comment}"></span></a>   
                        <div class="vote-button-index">
                            <form role="form" method="post" th:action="@{/comment/{commentId}/upvote(commentId=${comment.id})}" th:object="${upvoteComment}">

                                <input type="hidden" name="returnUrl" th:value="@{/profile/{vUserId}/comments(vUserId=${vUser.id})}">

                                <input type="image" class="upvote-button-index" src="https://png.pngtree.com/png-vector/20190419/ourmid/pngtree-vector-up-arrow-icon-png-image_956434.jpg">
                            </form>
                            <span th:text="${comment.votes}"></span>
                            <form role="form" method="post" th:action="@{/comment/{commentId}/downvote(commentId=${comment.id})}" th:object="${downvoteComment}">

                                <input type="hidden" name="returnUrl" th:value="@{/profile/{vUserId}/comments(vUserId=${vUser.id})}">

                                <input type="image" class="downvote-button-index" src="https://png.pngtree.com/png-vector/20190411/ourmid/pngtree-vector-down-arrow-icon-png-image_925727.jpg">
                            </form>
                        </div>
                

            </div>
        </div>
    </div>



    
</body>

</html>
