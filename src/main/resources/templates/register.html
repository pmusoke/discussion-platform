<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}"
>

<body>
    <div class="sub-body" layout:fragment="content">

        <div class="main-content">

            <div class="param-fail" th:if="${param.fail}">
                Username or email already exists
            </div>

            <div class="create-form-div">
                <form class="register-form" method="post" role="form" th:action="@{/register/save}" th:object="${user}">
                    <div class="form-field">
                        <label>Username</label>
                        <input 
                                type="text"
                                placeholder="Username"
                                th:field="*{username}"
                                class="username-register-input"
                        >

                        <p class="error-class" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                    </div>

                    <div class="form-field">
                        <label>Email</label>
                        <input 
                                type="text"
                                placeholder="Email"
                                th:field="*{email}"
                                class="email-register-input"
                        >
                        <p class="error-class" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>

                    <div class="form-field">
                        <label>Password</label>
                        <input 
                                type="password"
                                placeholder="Password"
                                th:field="*{password}"
                                class="password-register-input"
                        >
                        <p class="error-class" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <div class="form-field">
                    <label>Photo Url</label>
                        <input 
                                type="text"
                                placeholder="PhotoUrl"
                                th:field="*{photoUrl}"
                                class="photo-url-register-input"
                        >
                    </div>

                    <input class="create-button" th:href="@{/login}" type="submit" value="Continue">



                </form>

            </div>
            
        </div>

    </div>



    
</body>

</html>
