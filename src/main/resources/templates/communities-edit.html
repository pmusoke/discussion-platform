<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}"
>

<body>
    <div class="sub-body" layout:fragment="content">
        <div class="main-content">
            <div class="create-form-div">
                <form roles="form" method="post" th:action="@{/community/{communityName}/edit(communityName=${community.name})}" th:object="${community}">

                    <h1>Tell us about your community</h1>
                    <p>A name and description help people understand what your community is all about.</p>


                    <div class="form-field">
                        <label for="name">Name</label>
                        <input 
                                name="name"
                                th:field="*{name}"
                                placeholder="name"
                                type="text"
                        >
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                    </div>

                    <div class="form-field">
                        <label for="description">Description</label>
                        <input 
                                name="description"
                                th:field="*{description}"
                                placeholder="Description"
                                type="text"
                        >
                        <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                        <label for="communityPictureUrl">Picture URL</label>
                    </div>

                    <div class="form-field">
                        <input 
                                name="communityPictureUrl"
                                th:field="*{communityPictureUrl}"
                                placeholder="PictureUrl"
                                type="text"
                        >
                        <p th:if="${#fields.hasErrors('communityPictureUrl')}" th:errors="*{communityPictureUrl}"></p>
                        
                    </div>

                    <div class="form-field">
                        <label for="communityPictureHeaderUrl">Community Picture Header URL</label>
                        <input 
                                name="communityPictureHeaderUrl"
                                th:field="*{communityPictureHeaderUrl}"
                                placeholder="PictureUrl"
                                type="text"
                        >
                        <p th:if="${#fields.hasErrors('communityPictureUrl')}" th:errors="*{communityPictureUrl}"></p>

                        
                    </div>
                    <input class="create-button" type="submit" value="Update Community">
                </form>

            </div>
        </div>

    </div>



    
</body>

</html>
